<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suk_x Movies</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            <i class="fa-solid fa-film"></i>
            <span>Suk_x Movies</span>
        </div>

        <ul class="nav-links">

            <li>
                <a href="#" id="homeLink">Home</a>
            </li>

            <li>
                <a href="#" id="moviesLink">Movies</a>
            </li>

            <li>
                <a href="#" id="tvLink">TV Shows</a>
            </li>

            <li>
                <a href="#" id="animeLink">Anime</a>
            </li>

            <li>
                <a href="#" id="trendingLink">Trending</a>
            </li>

        </ul>

        <div class="nav-icons">

            <i class="fa-solid fa-heart"></i>

            <i class="fa-solid fa-user"></i>

        </div>

    </nav>

</header>


<!-- ================= HERO ================= -->

<section class="hero" id="hero">

    <div class="overlay"></div>

    <div class="hero-content">

        <h1 id="featuredTitle">
            Loading...
        </h1>

        <p id="featuredOverview">
            Loading featured movie...
        </p>

        <div class="hero-buttons">

            <button id="watchTrailer">
                <i class="fa-solid fa-play"></i>
                Watch Trailer
            </button>

            <button id="moreInfo">
                <i class="fa-solid fa-circle-info"></i>
                More Info
            </button>

        </div>

    </div>

</section>


<!-- ================= SEARCH ================= -->

<section class="search-section">

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search Movies, TV Shows or Anime..."
        >

        <button id="searchBtn">

            <i class="fa-solid fa-magnifying-glass"></i>

            Search

        </button>

    </div>


    <!-- SEARCH RESULTS APPEAR DIRECTLY HERE -->

    <div id="searchArea">

        <h2 id="searchTitle" class="search-title">
        </h2>

        <div id="searchResults" class="movie-grid search-grid">
        </div>

    </div>

</section>


<!-- ================= HOME CONTENT ================= -->

<div id="homeContent">


    <!-- TRENDING -->

    <section id="trendingSection">

        <h2 class="section-title">
            🔥 Trending Movies
        </h2>

        <div id="trendingMovies" class="movie-grid">
        </div>

    </section>


    <!-- POPULAR MOVIES -->

    <section id="popularSection">

        <h2 class="section-title">
            ⭐ Popular Movies
        </h2>

        <div id="popularMovies" class="movie-grid">
        </div>

    </section>


    <!-- POPULAR ANIME -->

    <section id="animeSection">

        <h2 class="section-title">
            🎌 Popular Anime
        </h2>

        <div id="animeMovies" class="movie-grid">
        </div>

    </section>


</div>


<!-- ================= MOVIE / TV MODAL ================= -->

<div id="movieModal" class="modal">

    <div class="modal-content">

        <span id="closeMovie" class="close">
            &times;
        </span>

        <div id="movieDetails">
        </div>

    </div>

</div>


<!-- ================= TRAILER MODAL ================= -->

<div id="trailerModal" class="modal">

    <div class="modal-content trailer-content">

        <span id="closeTrailer" class="close">
            &times;
        </span>

        <div id="trailerContainer">
        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
