<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suk_x Movies</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<nav class="navbar">

<div class="logo">
<i class="fa-solid fa-film"></i>
<span>Suk_x Movies</span>
</div>

<ul class="nav-links">
<li><a href="#">Home</a></li>
<li><a href="#">Movies</a></li>
<li><a href="#">TV Shows</a></li>
<li><a href="#">Anime</a></li>
<li><a href="#">Trending</a></li>
</ul>

<div class="nav-icons">

<i class="fa-solid fa-heart"></i>

<i class="fa-solid fa-user"></i>

</div>

</nav>

</header>

<section class="hero">

<div class="overlay"></div>

<div class="hero-content">

<h1 id="featuredTitle">
Featured Movie
</h1>

<p id="featuredOverview">
Loading featured movie...
</p>

<div class="hero-buttons">

<button id="watchTrailer">

<i class="fa-solid fa-play"></i>

Watch Trailer

</button>

<button id="moreInfo">

<i class="fa-solid fa-circle-info"></i>

More Info

</button>

</div>

</div>

</section>

<section class="search-section">

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search Movies, TV Shows or Anime...">

<button id="searchBtn">

<i class="fa-solid fa-magnifying-glass"></i>

Search

</button>

</div>

</section>

<section>

<h2 class="section-title">

🔥 Trending Movies

</h2>

<div id="trendingMovies" class="movie-grid">

</div>

</section>

<section>

<h2 class="section-title">

⭐ Popular Movies

</h2>

<div id="popularMovies" class="movie-grid">

</div>

</section>

<section>

<h2 class="section-title">

🎌 Popular Anime

</h2>

<div id="animeMovies" class="movie-grid">

</div>

</section>

<section>

<h2 class="section-title">

🎥 Search Results

</h2>

<div id="searchResults" class="movie-grid">

</div>

</section>

<div id="movieModal" class="modal">

<div class="modal-content">

<span class="close">&times;</span>

<div id="movieDetails"></div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
